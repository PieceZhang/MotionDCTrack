META_ARC: "motiondctrack"

BACKBONE:
    TYPE: "resnet50"
    KWARGS:
        used_layers: [2, 3, 4]
    PRETRAINED: 'resnet50.model'
    TRAIN_LAYERS: ['layer2', 'layer3', 'layer4']
    TRAIN_EPOCH: 5
    LAYERS_LR: 0.1

ADJUST:
    ADJUST: True
    TYPE: "AdjustAllLayer"
    KWARGS:
        in_channels: [512, 1024, 2048]
        out_channels: [256, 256, 256]

BAN:
    BAN: True
    TYPE: 'TransHead'
    KWARGS:
        in_channels: [256, 256, 256]
        enc_num: 4
        dec_num: 1
        cls_out_channels: 2  # if use sigmoid cls, cls_out_channel = 1 else 2

POINT:
    STRIDE: 8

TRACK:
    TYPE: 'SiamBANTracker'
    WINDOW_INFLUENCE: 0.4  # 0.4
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 255
    BASE_SIZE: 8
    CONTEXT_AMOUNT: 0.6  # 0.6
    LR: 0.1  # 0.1
    PENALTY_K: 0.3  # 0.3
    LT: False
    CONFIDENCE_LOW: 0.5
    CONFIDENCE_HIGH: 0.7

AuxBranch:
    AuxBranch: True
    DualAttn: True
    TYPE: 'CCA2'
    KWARGS:
        in_channels: [ 256, 256, 256 ]

Motion:
    Motion: True
    TYPE: 'MambaMT2'
    KWARGS:
        n: 24  # n frames, cover n/3 sec
        s: 10  # fps interpolation rate, fps becomes s*3 fps
        L: 240  # length of motion buffer L=n*s
        Gauss_mu: 0
        Gauss_sigma: 1

TRAIN:
    EPOCH: 10
    EXEMPLAR_SIZE: 127
    SEARCH_SIZE: 255
    OUTPUT_SIZE: 29
    START_EPOCH: 0 # 0 or resume checkpoint
    BATCH_SIZE: 6
    BASE_LR: 0.0005
    CLS_WEIGHT: 1.0
    LOC_WEIGHT: 1.0
    RESUME: ''  # 'checkpoint_e8_common.pth' or 'model.pth'

    LR:
        TYPE: 'log'
        KWARGS:
            start_lr: 0.0005
            end_lr: 0.0001
    LR_WARMUP:
        TYPE: 'step'
        EPOCH: 3
        KWARGS:
            start_lr: 0.0001
            end_lr: 0.0005
            step: 1

DATASET:
    NAMES:
    - 'MYENDOS'

    TEMPLATE:
        SHIFT: 4
        SCALE: 0.05
        BLUR: 0.0
        FLIP: 0.0
        COLOR: 0.25  # 1.0

    SEARCH:
        SHIFT: 16 # 64
        SCALE: 0.0 # 0.18
        BLUR: 0.2
        FLIP: 0.0  # 0.0
        COLOR: 0.25  # 1.0

    NEG: 0.0  # NEG: portion of negtive sample  (config.py default 0.1)
    GRAY: 0.0

    VIDEOS_PER_EPOCH: 600000

    MYENDOS:
        ANNO: 'training_dataset/my_endos/train.json'
